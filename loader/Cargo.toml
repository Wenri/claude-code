# The claude-dispatch hook: a tiny no_std staticlib linked into a custom glibc
# ld.so (see ../README.md and build.sh). Builds to libclaude_dispatch.a, which
# build.sh stages into the glibc build as elf/claude_dispatch.a.
[package]
name = "claude_dispatch"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
opt-level = "s"
