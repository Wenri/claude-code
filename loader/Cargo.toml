# claude-dispatch — a nix-ld-style bin crate whose final link cargo drives,
# pulling in glibc's rtld objects (librtld.os) as the runtime + entry point.
# See ../README.md and build.sh. rtld provides _start + libc; this crate provides
# only the `claude_dispatch` hook that glibc's patched dl_main calls.
[package]
name = "claude-dispatch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-dispatch"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = "s"
