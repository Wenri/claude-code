[workspace]
authors = ["Bingchen Gong <6704443+Wenri@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "claude-code"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Build claude-dispatch: a custom glibc ld.so that loads Claude Code (the kernel
# execs it, so /proc/self/exe is correct). Build tree: loader/.build/.
build-loader = "make -C loader"
# Build + install it to ~/.local/bin/claude-dispatch and print the launcher.
install-loader = "make -C loader install"

[dependencies]
gcc = ">=15.2.0,<15.3"
gxx = ">=15.2.0,<15.3"
make = ">=4.4.1,<5"
nodejs = ">=26.4.0,<26.5"
typescript = ">=6.0.2,<7"
rust = ">=1.96.0,<1.97"
bison = ">=3.8.2,<4"
git-lfs = ">=3.7.1,<4"
elfutils = ">=0.194,<0.195"
patchelf = ">=0.17.2,<0.18"

[feature.bun.dependencies]
bun = "*"

[environments]
# bun's conda-forge build pins an older icu than nodejs 26 needs, so they can't
# share one environment; bun gets its own:  pixi run -e bun bun <args>
bun = { features = ["bun"], no-default-feature = true }
