[workspace]
authors = ["Bingchen Gong <6704443+Wenri@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "claude-code"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Build the WSL1 ld-linux grep/find/rg fix (artifacts land in wsl1-ld-linux-fix/).
build-wsl-fix = "make -C wsl1-ld-linux-fix CC=gcc"
# Compile + install it to ~/.local and print the launcher shell function.
install-wsl-fix = "wsl1-ld-linux-fix/install.sh"

[dependencies]
gcc = ">=15.2.0,<15.3"
gxx = ">=15.2.0,<15.3"
make = ">=4.4.1,<5"
nodejs = ">=26.4.0,<26.5"
typescript = ">=6.0.2,<7"

[feature.bun.dependencies]
bun = "*"

[environments]
# bun's conda-forge build pins an older icu than nodejs 26 needs, so they can't
# share one environment; bun gets its own:  pixi run -e bun bun <args>
bun = { features = ["bun"], no-default-feature = true }
