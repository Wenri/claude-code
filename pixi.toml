[workspace]
authors = ["Bingchen Gong <6704443+Wenri@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "claude-code"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Build the claude-dispatch in-process loader (artifacts land in loader/target/).
build-loader = "make -C loader"
# Build + install it to ~/.local and print the launcher shell function.
install-loader = "loader/install.sh"

[dependencies]
gcc = ">=15.2.0,<15.3"
gxx = ">=15.2.0,<15.3"
make = ">=4.4.1,<5"
nodejs = ">=26.4.0,<26.5"
typescript = ">=6.0.2,<7"
rust = ">=1.96.0,<1.97"

[feature.bun.dependencies]
bun = "*"

[environments]
# bun's conda-forge build pins an older icu than nodejs 26 needs, so they can't
# share one environment; bun gets its own:  pixi run -e bun bun <args>
bun = { features = ["bun"], no-default-feature = true }
